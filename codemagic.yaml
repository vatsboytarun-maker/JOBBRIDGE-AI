workflows:
  android-workflow:
    name: JOBBRIDGE AI Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Flutter Android project
        script: |
          cd mobile
          flutter create . --platforms=android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              p.write_text(s)
          PY
          flutter pub get
      - name: Build release APK
        script: |
          cd mobile
          flutter build apk --release
    artifacts:
      - mobile/build/**/outputs/**/*.apk

workflows:
  android-workflow:
    name: JOBBRIDGE AI Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Flutter Android project
        script: |
          cd mobile
          flutter create . --platforms=android
          flutter pub get
      - name: Build release APK
        script: |
          cd mobile
          flutter build apk --release
    artifacts:
      - mobile/build/**/outputs/**/*.apk
